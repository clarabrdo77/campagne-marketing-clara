<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation | Bad Bunny Paris 2026</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Fond d'écran assombri pour faire ressortir le formulaire */
            background-image: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.95)), url('https://focus.courrierinternational.com/2025/09/21/0/0/5472/3648/1280/0/60/0/b13901c_ftp-import-images-1-4wf6cjqmrplo-2236505304.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            color: var(--neon-blue);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(5, 217, 232, 0.5);
        }

        /* Style de la boîte du formulaire */
        .form-container {
            background-color: rgba(20, 20, 20, 0.85);
            border: 2px solid var(--neon-pink);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.2);
        }

        /* Style des champs de saisie */
        .form-label {
            color: var(--neon-pink);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .form-control, .form-select {
            background-color: var(--bg-card);
            border: 1px solid #444;
            color: var(--text-light);
            padding: 12px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(5, 217, 232, 0.5);
            color: white;
        }
        
        /* Personnaliser la couleur du texte dans le menu déroulant */
        option {
            background-color: var(--bg-card);
            color: var(--text-light);
        }

        /* Bouton d'action principal */
        .btn-glow {
            background: var(--neon-pink);
            color: var(--text-light);
            font-family: 'Oswald', sans-serif;
            border: none;
            letter-spacing: 2px;
            font-size: 1.2rem;
            padding: 15px;
            transition: all 0.3s;
            box-shadow: 0 0 15px var(--neon-pink);
            text-transform: uppercase;
        }
        .btn-glow:hover {
            background: var(--text-light);
            color: var(--neon-pink);
            box-shadow: 0 0 25px var(--text-light);
            transform: scale(1.02);
        }

        /* Bouton de retour */
        .btn-return {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            transition: 0.3s;
        }
        .btn-return:hover {
            background-color: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }
    </style>
</head>

<body>

    <div class="container py-5 w-100">
        <div class="form-container p-4 p-md-5 mx-auto" style="max-width: 600px;">
            
            <h1 class="h2 mb-2 text-center">SÉCURISER MA PLACE</h1>
            <p class="text-center mb-4" style="color: #bbb; font-size: 0.95rem;">
                Complétez ce formulaire pour valider votre commande pour l'unique date parisienne du World Tour 2026.
            </p>

            <form action="merci.html">

                <div class="mb-4">
                    <label class="form-label">Nom complet</label>
                    <input class="form-control" type="text" placeholder="Ex: Benito Antonio" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Courriel</label>
                    <input class="form-control" type="email" placeholder="ton_adresse@mail.com" required>
                </div>

                <div class="mb-5">
                    <label class="form-label">Choix de la zone</label>
                    <select class="form-select" required>
                        <option value="" disabled selected>Sélectionne ton billet...</option>
                        <option value="fosse">FOSSE OR - 129 €</option>
                        <option value="gradin">GRADIN CAT 1 - 149 €</option>
                        <option value="vip">PACK VIP LOUNGE - 349 €</option>
                    </select>
                </div>

                <button class="btn btn-glow w-100 mb-3" type="submit">
                    Je confirme ma commande
                </button>

                <a class="btn btn-return w-100 py-2" href="index.html">
                    Retour à l'accueil
                </a>

            </form>

        </div>
    </div>

</body>
</html>
